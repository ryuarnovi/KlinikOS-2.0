services:
  db:
    image: postgres:15-alpine
    container_name: klinikos_db
    # set resources limits and reservation 
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'  
          memory: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_IP}:${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klinikos_backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    # ini ngasih tau docker kalo env di dalam folder backend
    env_file:
      - ./backend/.env
    # habis itu di inisialisasi di environment
    environment:
      DEBUG: false
    volumes:
      - ./backend/.env:/app/.env
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:9090/api || exit 1"]
    #   interval: 60s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: klinikos_frontend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    restart: always
    environment:
      # untuk API = dari FE diarahkan ke BE jadi domain+port/endpoint nya
      - NEXT_PUBLIC_API_URL=http://localhost:9090/api
    ports:
      - "3032:3000"
    depends_on:
      db:
        condition: service_healthy
      # backend:
        # condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    # untuk networks di FE kasih network BE juga biar bisa connect antara
    # FE dan BE nya 
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - backend_net

volumes:
  db_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge